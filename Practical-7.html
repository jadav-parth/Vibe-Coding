<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sem 5 Practical - JS & UI Components</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card h2 {
            font-size: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #38bdf8;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #cbd5e1;
        }

        .form-group input {
            width: 100%;
            padding: 10px 15px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0ea5e9;
        }

        /* Result Box */
        .result-box {
            margin-top: 15px;
            padding: 10px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            color: #38bdf8;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Practical Part 1: Interactive Calculator -->
        <div class="card">
            <h2><i class="fa-solid fa-calculator"></i> Simple Calculator</h2>
            <div class="form-group">
                <label>Enter First Number</label>
                <input type="number" id="num1" placeholder="e.g. 10">
            </div>
            <div class="form-group">
                <label>Enter Second Number</label>
                <input type="number" id="num2" placeholder="e.g. 5">
            </div>
            <button class="btn" onclick="calculateSum()">Calculate Addition</button>
            <div class="result-box" id="calcResult">Result will appear here</div>
        </div>

        <!-- Practical Part 2: Form Validation -->
        <div class="card">
            <h2><i class="fa-solid fa-user-check"></i> Registration Form</h2>
            <form onsubmit="validateForm(event)">
                <div class="form-group">
                    <label>Student Name</label>
                    <input type="text" id="username" placeholder="Enter full name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="Enter email">
                </div>
                <button type="submit" class="btn">Submit Record</button>
                <div class="result-box" id="formMsg" style="display:none;"></div>
            </form>
        </div>
    </div>

    <script>
        // JavaScript for Calculator Practical
        function calculateSum() {
            let n1 = parseFloat(document.getElementById('num1').value);
            let n2 = parseFloat(document.getElementById('num2').value);
            let resBox = document.getElementById('calcResult');

            if (isNaN(n1) || isNaN(n2)) {
                resBox.innerHTML = "Please enter valid numbers!";
                resBox.style.color = "#ef4444";
            } else {
                let sum = n1 + n2;
                resBox.innerHTML = "Addition Result: " + sum;
                resBox.style.color = "#38bdf8";
            }
        }

        // JavaScript for Form Validation Practical
        function validateForm(event) {
            event.preventDefault();
            let name = document.getElementById('username').value.trim();
            let email = document.getElementById('email').value.trim();
            let msgBox = document.getElementById('formMsg');

            msgBox.style.display = "block";
            if (name === "" || email === "") {
                msgBox.innerHTML = "All fields are required!";
                msgBox.style.color = "#ef4444";
            } else {
                msgBox.innerHTML = "Success! Form validated successfully.";
                msgBox.style.color = "#22c55e";
            }
        }
    </script>

</body>
</html>
